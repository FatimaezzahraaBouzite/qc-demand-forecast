[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-demand"
version = "0.1.0"
description = "Day-ahead forecasting of Québec electricity demand with an MLOps pipeline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=14",
  "openpyxl>=3.1",
  "requests>=2.31",
  "pyyaml>=6",
  "holidays>=0.40",
  "statsmodels>=0.14",
  "lightgbm>=4.1",
  "joblib>=1.3",
  "mlflow>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "dvc>=3.40"]
aws = ["boto3>=1.34"]
app = ["streamlit>=1.32", "plotly>=5.18"]

[project.scripts]
qc-demand = "qc_demand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
