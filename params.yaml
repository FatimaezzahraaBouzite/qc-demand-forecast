data:
  years: [2019, 2020, 2021, 2022, 2023]
  hq_url_template: "https://www.hydroquebec.com/data/documents-donnees/donnees-ouvertes/xlsx/historique-demande/{year}-demande-electricite-quebec.xlsx"
  # Population-weighted weather: demand is driven by heating load where people live
  cities:
    montreal:   {lat: 45.50, lon: -73.57, weight: 0.60}
    quebec:     {lat: 46.81, lon: -71.21, weight: 0.20}
    gatineau:   {lat: 45.48, lon: -75.70, weight: 0.10}
    sherbrooke: {lat: 45.40, lon: -71.89, weight: 0.10}
  timezone: "America/Toronto"

features:
  lags: [1, 2, 7, 14]
  rolling_windows: [7, 28]
  hdd_base_c: 15.0
  cdd_base_c: 18.0

backtest:
  n_folds: 4
  test_days: 91        # one quarter per fold, rolling origin, expanding window
  min_train_days: 730

models:
  seasonal_naive: {}
  sarimax:
    order: [1, 0, 1]
    seasonal_order: [1, 0, 1, 7]
  lightgbm: 
    target_base: lag_1 
    n_estimators: 600
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.9
    subsample_freq: 1
    colsample_bytree: 0.9
    random_state: 42
    verbose: -1

selection_metric: mape

monitoring:
  window_days: 14
  mape_alert_ratio: 1.5   # alert if live MAPE > 1.5x backtest MAPE
  psi_alert: 0.2

mlflow:
  experiment: qc-demand-forecast
  tracking_uri: "sqlite:///mlflow.db"
